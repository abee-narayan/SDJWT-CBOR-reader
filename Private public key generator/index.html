<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptographic Key Generator</title>
    <meta name="description" content="Generate ES256 and RS256 cryptographic keys for Verifiable Credentials." />
    <meta name="keywords" content="Aadhaar, SD-JWT, mDOC, Verifiable credentials, Digital ID Wallet, Face Authentication, EUDI Wallet, Trust Registry, W3C VCDM, ISO MDOC, ZKP, Age Assurance, Long Fellow" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://vcreader.com/Private%20public%20key%20generator/index.html" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vcreader.com/Private%20public%20key%20generator/index.html" />
    <meta property="og:title" content="Cryptographic Key Generator" />
    <meta property="og:description" content="Generate ES256 and RS256 cryptographic keys for Verifiable Credentials." />
    <meta property="og:image" content="https://vcreader.com/assets/trust_registry.png" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://vcreader.com/Private%20public%20key%20generator/index.html" />
    <meta property="twitter:title" content="Cryptographic Key Generator" />
    <meta property="twitter:description" content="Generate ES256 and RS256 cryptographic keys for Verifiable Credentials." />
    <meta property="twitter:image" content="https://vcreader.com/assets/trust_registry.png" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="background-orb orb-1"></div>
    <div class="background-orb orb-2"></div>
    <div class="background-orb orb-3"></div>

    <main class="glass-container">
        <header>
            <h1>Key Generator</h1>
            <p>Generate secure cryptographic keys for JWT, SD-JWT, and standard implementations directly in your browser.</p>
        </header>

        <section class="controls">
            <div class="input-group">
                <label for="algorithm-select">Algorithm</label>
                <select id="algorithm-select">
                    <optgroup label="HMAC (Symmetric)">
                        <option value="HS256">HS256 (HMAC with SHA-256)</option>
                        <option value="HS384">HS384 (HMAC with SHA-384)</option>
                        <option value="HS512">HS512 (HMAC with SHA-512)</option>
                    </optgroup>
                    <optgroup label="RSA (PKCS1-v1_5)">
                        <option value="RS256" selected>RS256 (RSA with SHA-256)</option>
                        <option value="RS384">RS384 (RSA with SHA-384)</option>
                        <option value="RS512">RS512 (RSA with SHA-512)</option>
                    </optgroup>
                    <optgroup label="RSA-PSS">
                        <option value="PS256">PS256 (RSA-PSS with SHA-256)</option>
                        <option value="PS384">PS384 (RSA-PSS with SHA-384)</option>
                        <option value="PS512">PS512 (RSA-PSS with SHA-512)</option>
                    </optgroup>
                    <optgroup label="ECDSA">
                        <option value="ES256">ES256 (ECDSA P-256)</option>
                        <option value="ES384">ES384 (ECDSA P-384)</option>
                        <option value="ES512">ES512 (ECDSA P-521)</option>
                    </optgroup>
                    <optgroup label="EdDSA">
                        <option value="EdDSA">EdDSA (Ed25519)</option>
                    </optgroup>
                </select>
            </div>
            <button id="generate-btn" class="primary-btn">
                <span class="btn-text">Generate Keys</span>
                <div class="spinner" id="generate-spinner"></div>
            </button>
        </section>

        <div id="error-message" class="alert hidden"></div>

        <section class="results hidden" id="results-section">
            <div class="key-card" id="private-key-card">
                <div class="card-header">
                    <h2>Private Key <span class="tag" id="private-tag">PEM</span></h2>
                    <button class="download-btn" id="download-private-btn" title="Download Private Key">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download
                    </button>
                </div>
                <textarea id="private-key-display" readonly spellcheck="false"></textarea>
            </div>

            <div class="key-card" id="public-key-card">
                <div class="card-header">
                    <h2>Public Key <span class="tag">PEM</span></h2>
                    <button class="download-btn" id="download-public-btn" title="Download Public Key">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download
                    </button>
                </div>
                <textarea id="public-key-display" readonly spellcheck="false"></textarea>
            </div>
        </section>
    </main>
</body>
</html>
