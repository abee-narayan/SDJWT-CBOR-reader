<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CER to PEM Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0d14;
            --surface: #111520;
            --surface2: #181d2e;
            --border: rgba(255, 255, 255, 0.07);
            --border2: rgba(255, 255, 255, 0.12);
            --text: #e8eaf2;
            --text-muted: #8b93b0;
            --accent: #6c8fe8;
            --accent2: #9b5de5;
            --radius: 14px;
            --radius-sm: 8px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            padding: 32px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #e8eaf2 30%, #6c8fe8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .upload-area {
            border: 2px dashed var(--border2);
            border-radius: var(--radius-sm);
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.02);
            position: relative;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(108, 143, 232, 0.05);
        }

        .upload-icon {
            color: var(--accent);
            margin-bottom: 12px;
        }

        .upload-text {
            font-size: 15px;
            font-weight: 500;
        }

        .upload-subtext {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        #fileInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .result-area {
            margin-top: 24px;
            display: none;
            text-align: left;
        }

        .result-area.active {
            display: block;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            margin-bottom: 12px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #4f6ef7, #9b5de5);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            width: 100%;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .error-message {
            color: #f25f5c;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CER to PEM Converter</h1>
    <p>Upload a .cer public certificate to extract and download the PEM file.</p>

    <div class="upload-area" id="uploadArea">
        <svg class="upload-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <div class="upload-text">Click to upload or drag and drop</div>
        <div class="upload-subtext">.cer files only</div>
        <input type="file" id="fileInput" accept=".cer">
    </div>

    <div class="error-message" id="errorMessage">Invalid file format. Please upload a .cer file.</div>

    <div class="result-area" id="resultArea">
        <textarea id="pemOutput" readonly></textarea>
        <button class="btn-primary" id="downloadBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download PEM
        </button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js"></script>
<script src="app.js"></script>
</body>
</html>
